# Master feeder configuration.
#
# Every entry here was checked with a live curl request while this file was
# written (2026-09-06) -- not copied blindly from calendar_source_types.md, which
# in a few cases turned out to be stale (SP2's TEC REST route is disabled; Penn
# Today sits behind a Cloudflare challenge that blocks a plain HTTP client).
#
# `registry_url` must match a `Calendar URL` value in penn-calendars.csv exactly
# (run `import-registry` before `run-all`, or these feeders log a warning and run
# with no calendar_id / registry-derived tags).

version: 1

defaults:
  timezone: America/New_York
  user_agent: "PennEventsBot/1.0 (+https://github.com/upennevents; contact: pranshav.lakhia@gmail.com)"
  timeout_seconds: 30
  retries: 3
  rate_limit_per_host: 0.5
  horizon_days: 180
  schedule: "0 */6 * * *"

feeders:
  # --- ICS: one implementation covers LiveWhale, VPUL, Trumba, TEC exports, ---
  # --- CampusGroups and Drupal 7 /ics. Confirmed live below.                ---
  - id: vpul-university-life
    type: ics
    registry_url: https://ulife.vpul.upenn.edu/calendar/
    host: University Life
    tags: [student-life]
    config:
      url: https://ulife.vpul.upenn.edu/calendar/ics/subscribe

  # --- LiveWhale: the Subscribe button's real feed URL is generated client-side, ---
  # --- but it's not a per-site secret -- LiveWhale's own frontend JS            ---
  # --- (calendar.rev.*.js, `getLink()`) builds it as a fixed pattern:           ---
  # --- `<site-root>/live/ical/events` (config's `liveurl_dir` + `/ical/events`, ---
  # --- read straight out of the minified bundle, not guessed). Confirmed live   ---
  # --- for all three schools below (2026-09-07, after ingestion/RRULE           ---
  # --- expansion): PSOM 421 events, Law 218 (of ~226 -- see ics_adapter's        ---
  # --- truncation-repair note, a real upstream CDN bug on Law's feed, not ours), ---
  # --- Nursing 57. Law's `/calendar/view/all` HTML page 403s at CloudFront for   ---
  # --- any UA (bot-blocked, same as Annenberg/Penn Today -- not spoofing past    ---
  # --- it), but this feed *path* is not behind that block and returns real data. ---
  - id: psom-livewhale
    type: ics
    registry_url: https://events.med.upenn.edu/
    host: Perelman School of Medicine
    tags: [medicine]
    config:
      url: https://events.med.upenn.edu/live/ical/events

  - id: law-livewhale
    type: ics
    registry_url: https://www.law.upenn.edu/calendar/
    host: Penn Carey Law
    tags: [law]
    config:
      url: https://www.law.upenn.edu/live/ical/events

  - id: nursing-livewhale
    type: ics
    registry_url: https://www.nursing.upenn.edu/calendar/
    host: School of Nursing
    tags: [nursing]
    config:
      url: https://www.nursing.upenn.edu/live/ical/events

  # --- Wharton: the registry's "School" row (www.wharton.upenn.edu/events/) is a  ---
  # --- Salesforce Lightning widget with no server-rendered content or feed to    ---
  # --- scrape (confirmed via view-source, still true, needs Playwright) -- but   ---
  # --- that row's own notes point to groups.wharton.upenn.edu/events, a separate ---
  # --- registry row for Wharton's real CampusGroups events, which has a genuine  ---
  # --- ICS feed. Found by fetching the page's `/ics_helper?...&TB_context=       ---
  # --- Subscribe_To_Calendars` modal (linked from its own "Subscribe" button)    ---
  # --- and reading the aggregate feed URL out of its "Add to Google Calendar"    ---
  # --- link -- 205 real events confirmed live (2026-09-07). This does not        ---
  # --- resolve the literal www.wharton.upenn.edu/events/ row, but it does give   ---
  # --- Wharton real event data under school_division=Wharton.                   ---
  - id: wharton-campusgroups
    type: ics
    registry_url: https://groups.wharton.upenn.edu/events
    host: The Wharton School
    tags: [business]
    config:
      url: "https://groups.wharton.upenn.edu/ical/wharton/ical_wharton.ics?calid=2"

  # --- RSS: SAS's feed embeds a <sdo:Event> schema.org block per item with a  ---
  # --- real startDate/endDate, not just the item's publish date -- confirmed ---
  # --- live and preferred over <pubDate> by the adapter.                     ---
  - id: sas-rss
    type: rss
    registry_url: https://www.sas.upenn.edu/events/
    host: School of Arts & Sciences
    tags: [arts-and-sciences]
    config:
      url: https://www.sas.upenn.edu/events/rss.xml

  # --- Declarative HTML/CSS: selectors below were read from each site's real ---
  # --- markup (2026-09-07), not guessed -- see plan notes for full snippets. ---
  - id: gse-html
    type: html_css
    registry_url: https://www.gse.upenn.edu/events
    host: Penn GSE
    tags: [education]
    config:
      list_url: https://www.gse.upenn.edu/events
      item: "li.node--type-event"
      fields:
        event_name: {css: "a.event_list_item_title_link", attr: text}
        event_url: {css: "a.event_list_item_title_link", attr: href}
        # Drupal renders this as a Unix epoch string, e.g. datetime="1788998400"
        # -- normalize.datetimes.parse_datetime special-cases that shape.
        starts_at: {css: "time.event_list_item_time", attr: datetime}
        description: {css: ".event_list_item_description", attr: text}

  - id: dental-html
    type: html_css
    registry_url: https://www.dental.upenn.edu/events/
    host: Penn Dental
    tags: [dental]
    config:
      list_url: https://www.dental.upenn.edu/events/
      item: "div.row.pt-3.mb-3"
      fields:
        event_name: {css: "h2.page-title", attr: text}
        event_url: {css: "a", attr: href}
        starts_at: {css: "small", attr: text}
        location: {css: "span.fs-6.fw-light", attr: text}

  - id: design-html
    type: html_css
    registry_url: https://www.design.upenn.edu/events
    host: Stuart Weitzman School of Design
    tags: [design]
    config:
      list_url: https://www.design.upenn.edu/events
      item: "a.event-row"
      fields:
        event_name: {css: "span.title", attr: text}
        event_url: {css: "", attr: href}  # the item element itself is the <a>
        starts_at: {css: ".event-date", attr: text}

  - id: sp2-html
    type: html_css
    registry_url: https://www.sp2.upenn.edu/events/
    host: SP2
    tags: [social-policy]
    config:
      list_url: https://www.sp2.upenn.edu/events/
      item: "div.events-archive__item"
      fields:
        event_name: {css: "h3.event-item__title a", attr: text}
        event_url: {css: "h3.event-item__title a", attr: href}
        starts_at: {css: "time", attr: datetime}
        location: {css: ".event-item__location", attr: text}

  # --- The Events Calendar REST API: the best-behaved format in the       ---
  # --- registry. Confirmed live below.                                    ---
  - id: engineering-tec
    type: tec_rest
    registry_url: https://events.engineering.upenn.edu/
    host: Penn Engineering
    tags: [engineering]
    config:
      base_url: https://events.engineering.upenn.edu
      per_page: 50

  - id: vet-tec
    type: tec_rest
    registry_url: https://www.vet.upenn.edu/about/penn-vet-events-calendar
    host: Penn Vet
    tags: [veterinary]
    config:
      base_url: https://www.vet.upenn.edu
      per_page: 50

  - id: faculty-senate-tec
    type: tec_rest
    registry_url: https://facultysenate.upenn.edu/events/
    host: Faculty Senate
    tags: [faculty, governance]
    config:
      base_url: https://facultysenate.upenn.edu
      per_page: 50

  # --- Almanac: bot-blocked at the nginx layer for any UA containing a         ---
  # --- `(+http...)`-style contact URL (the conventional "polite crawler"       ---
  # --- format) regardless of the rest of the string -- confirmed live,        ---
  # --- 2026-09-07, by testing several UA variants; contradicted by the site's  ---
  # --- own robots.txt (`User-agent: *`, `Crawl-delay: 10`, no bot disallow),   ---
  # --- so this is a keyword/pattern false positive, not a deliberate block --  ---
  # --- unlike Annenberg/Penn Today below, where the block holds even for an   ---
  # --- exact Chrome UA. `user_agent` drops the URL but keeps a real,          ---
  # --- contactable identity (see feeders/almanac.py). The page itself is not  ---
  # --- a flat teaser list -- events are grouped into Bootstrap accordion      ---
  # --- panels by category (Talks, Music, ...), each a <p> with a bold day-of- ---
  # --- month that only appears on the first event of a day, so it needed a    ---
  # --- bespoke feeder/adapter pair instead of `html_css`'s field selectors.   ---
  - id: almanac-calendar
    type: almanac_calendar
    registry_url: https://almanac.upenn.edu/at-penn-calendar
    host: University
    tags: [university-wide]
    config:
      url: https://almanac.upenn.edu/at-penn-calendar
      user_agent: "PennEventsMonitor/1.0 (contact: pranshav.lakhia@gmail.com)"

  # --- Playwright: Penn Today and Annenberg both sit behind Cloudflare's        ---
  # --- "managed" JS challenge (`cType: 'managed'` in the response body,         ---
  # --- confirmed live 2026-09-07) -- a plain HTTP client 403s even sending an   ---
  # --- exact Chrome UA, so unlike Almanac above this genuinely needs a real     ---
  # --- browser, not a UA change. A stock headless Chromium (no stealth/         ---
  # --- fingerprint-spoofing plugins, no navigator.webdriver patching -- see     ---
  # --- feeders/playwright_html.py) executing the real challenge JS and waiting  ---
  # --- for it to resolve passes cleanly, presenting our honest PennEventsBot    ---
  # --- identity throughout. Reuses html_css's item/fields selector engine       ---
  # --- (adapters/html_adapter.py's `starts_time` field: some cards split date   ---
  # --- and time-of-day into separate elements) -- only the fetch differs.      ---
  - id: penn-today-html
    type: playwright_html
    registry_url: https://penntoday.upenn.edu/events
    host: University
    tags: [university-wide]
    config:
      list_url: https://penntoday.upenn.edu/events
      wait_selector: "article.event-card"
      item: "article.event-card"
      fields:
        event_name: {css: ".c-text .title .shy", attr: text}
        event_url: {css: "a.overlink", attr: href}
        starts_at: {css: ".c-date", attr: text}
        starts_time: {css: ".meta-list-item.event-time", attr: text}
        location: {css: ".meta-list-item.location", attr: text}
        description: {css: ".abstract", attr: text}

  - id: annenberg-html
    type: playwright_html
    registry_url: https://www.asc.upenn.edu/news-events/events
    host: Annenberg School for Communication
    tags: [communication]
    config:
      list_url: https://www.asc.upenn.edu/news-events/events
      wait_selector: "div.card--event"
      item: "div.card--event"
      fields:
        event_name: {css: "h2.h4 a", attr: text}
        event_url: {css: "h2.h4 a", attr: href}
        starts_at: {css: "time.show-for-sr", attr: datetime}
        starts_time: {css: "span.time", attr: text}
        location: {css: "ul.locations li", attr: text}
        description: {css: "p.medium-text", attr: text}

# Deliberately not wired yet (each needs more than a plain HTTP GET to resolve):
#
#   - Wharton's own www.wharton.upenn.edu/events/ registry row -- confirmed via
#     view-source that the page is a Salesforce "EventsHQ" widget
#     (wharton.my.salesforce-sites.com/wevents/lightning/lightning.out.js)
#     rendered entirely client-side; there is no server-rendered listing or feed
#     to scrape. Needs the Playwright feeder. (Real Wharton event data is wired
#     via the `wharton-campusgroups` feeder above instead -- a different
#     registry row for the same school, with a real feed.)
#
generators:
  # --- Athletics: SIDEARM's schedule pages (pennathletics.com/sports/<slug>/    ---
  # --- schedule) turned out to need no new feeder type at all -- each page      ---
  # --- embeds a bare JSON-LD array of `@type: "SportsEvent"` blocks (confirmed  ---
  # --- live, 2026-09-07, across football/wrestling/volleyball/crew/cross        ---
  # --- country -- same shape every time). SportsEvent is a schema.org subtype   ---
  # --- of Event, so `jsonld_adapter._iter_event_nodes` was widened to accept    ---
  # --- any `*Event` type, not a new adapter. Slugs below match                  ---
  # --- `calendars.calendar_url` exactly (all 32 confirmed present in the        ---
  # --- registry as "Athletics (team schedule)" rows) and pennathletics.com's    ---
  # --- own nav, not guessed.
  - id: athletics-teams
    type: jsonld
    host: Athletics
    tags: [athletics]
    for_each:
      - baseball
      - mens-basketball
      - mens-crew
      - mens-cross-country
      - mens-fencing
      - mens-golf
      - mens-lacrosse
      - mens-rowing
      - mens-soccer
      - mens-squash
      - mens-swimming-and-diving
      - mens-tennis
      - mens-track-and-field
      - field-hockey
      - football
      - softball
      - sprint-football
      - womens-basketball
      - womens-cross-country
      - womens-fencing
      - womens-golf
      - womens-gymnastics
      - womens-lacrosse
      - womens-rowing
      - womens-soccer
      - womens-squash
      - womens-swimming-and-diving
      - womens-tennis
      - womens-track-and-field
      - womens-volleyball
      - wrestling
    template:
      id: "athletics-{item}"
      registry_url: "https://pennathletics.com/sports/{item}/schedule"
      tags: ["{item}"]
      config:
        url: "https://pennathletics.com/sports/{item}/schedule"
