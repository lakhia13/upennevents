# Master feeder configuration.
#
# Every entry here was checked with a live curl request while this file was
# written (2026-09-06) -- not copied blindly from calendar_source_types.md, which
# in a few cases turned out to be stale (SP2's TEC REST route is disabled; Penn
# Today sits behind a Cloudflare challenge that blocks a plain HTTP client).
#
# `registry_url` must match a `Calendar URL` value in penn-calendars.csv exactly
# (run `import-registry` before `run-all`, or these feeders log a warning and run
# with no calendar_id / registry-derived tags).
#
# Long-tail note (2026-09-07): the registry has ~140 rows that look unwired but
# deliberately aren't, because they're already fully captured by a feeder above --
# confirmed by bulk-probing every unwired row's URL, not assumed from the domain
# alone. Two different reasons, worth telling apart before adding a new feeder:
#   1. Global-API sites (LiveWhale `ics`, TEC `tec_rest`, CampusGroups `ics`) --
#      their REST/subscribe endpoint returns every event site-wide regardless of
#      which page embeds the widget, so a registry row for one department's
#      *filtered view* of that same install (e.g. events.med.upenn.edu/<group>/,
#      36 of these; www.law.upenn.edu/institutes/<x>/) is the exact same feed,
#      confirmed by identical event counts. Safe to skip outright.
#   2. Single-page `html_css`/`jsonld`/`rss` sites -- NOT automatically covered
#      just by sharing a domain (each feeder here only fetches the one page it's
#      configured with), but several school sites' department/center sub-pages
#      turned out to be *filtered views of the same master calendar* the main
#      page already shows (confirmed for design.upenn.edu: same event titles
#      appear on both /architecture and /events). Verify this per-school before
#      assuming it, though -- it is not guaranteed the way #1 is.
# Before adding a feeder for a URL that looks like a gap, check whether it's
# actually one of these two cases first.

version: 1

defaults:
  timezone: America/New_York
  user_agent: "PennEventsBot/1.0 (+https://github.com/upennevents; contact: pranshav.lakhia@gmail.com)"
  timeout_seconds: 30
  retries: 3
  rate_limit_per_host: 0.5
  horizon_days: 180
  schedule: "0 */6 * * *"

feeders:
  # --- ICS: one implementation covers LiveWhale, VPUL, Trumba, TEC exports, ---
  # --- CampusGroups and Drupal 7 /ics. Confirmed live below.                ---
  - id: vpul-university-life
    type: ics
    registry_url: https://ulife.vpul.upenn.edu/calendar/
    host: University Life
    tags: [student-life]
    config:
      url: https://ulife.vpul.upenn.edu/calendar/ics/subscribe

  # --- LiveWhale: the Subscribe button's real feed URL is generated client-side, ---
  # --- but it's not a per-site secret -- LiveWhale's own frontend JS            ---
  # --- (calendar.rev.*.js, `getLink()`) builds it as a fixed pattern:           ---
  # --- `<site-root>/live/ical/events` (config's `liveurl_dir` + `/ical/events`, ---
  # --- read straight out of the minified bundle, not guessed). Confirmed live   ---
  # --- for all three schools below (2026-09-07, after ingestion/RRULE           ---
  # --- expansion): PSOM 421 events, Law 218 (of ~226 -- see ics_adapter's        ---
  # --- truncation-repair note, a real upstream CDN bug on Law's feed, not ours), ---
  # --- Nursing 57. Law's `/calendar/view/all` HTML page 403s at CloudFront for   ---
  # --- any UA (bot-blocked, same as Annenberg/Penn Today -- not spoofing past    ---
  # --- it), but this feed *path* is not behind that block and returns real data. ---
  - id: psom-livewhale
    type: ics
    registry_url: https://events.med.upenn.edu/
    host: Perelman School of Medicine
    tags: [medicine]
    config:
      url: https://events.med.upenn.edu/live/ical/events

  - id: law-livewhale
    type: ics
    registry_url: https://www.law.upenn.edu/calendar/
    host: Penn Carey Law
    tags: [law]
    config:
      url: https://www.law.upenn.edu/live/ical/events

  - id: nursing-livewhale
    type: ics
    registry_url: https://www.nursing.upenn.edu/calendar/
    host: School of Nursing
    tags: [nursing]
    config:
      url: https://www.nursing.upenn.edu/live/ical/events

  # --- Wharton: the registry's "School" row (www.wharton.upenn.edu/events/) is a  ---
  # --- Salesforce Lightning widget with no server-rendered content or feed to    ---
  # --- scrape (confirmed via view-source, still true, needs Playwright) -- but   ---
  # --- that row's own notes point to groups.wharton.upenn.edu/events, a separate ---
  # --- registry row for Wharton's real CampusGroups events, which has a genuine  ---
  # --- ICS feed. Found by fetching the page's `/ics_helper?...&TB_context=       ---
  # --- Subscribe_To_Calendars` modal (linked from its own "Subscribe" button)    ---
  # --- and reading the aggregate feed URL out of its "Add to Google Calendar"    ---
  # --- link -- 205 real events confirmed live (2026-09-07). This does not        ---
  # --- resolve the literal www.wharton.upenn.edu/events/ row, but it does give   ---
  # --- Wharton real event data under school_division=Wharton.                   ---
  - id: wharton-campusgroups
    type: ics
    registry_url: https://groups.wharton.upenn.edu/events
    host: The Wharton School
    tags: [business]
    config:
      url: "https://groups.wharton.upenn.edu/ical/wharton/ical_wharton.ics?calid=2"

  # --- RSS: SAS's feed embeds a <sdo:Event> schema.org block per item with a  ---
  # --- real startDate/endDate, not just the item's publish date -- confirmed ---
  # --- live and preferred over <pubDate> by the adapter.                     ---
  - id: sas-rss
    type: rss
    registry_url: https://www.sas.upenn.edu/events/
    host: School of Arts & Sciences
    tags: [arts-and-sciences]
    config:
      url: https://www.sas.upenn.edu/events/rss.xml

  # --- Declarative HTML/CSS: selectors below were read from each site's real ---
  # --- markup (2026-09-07), not guessed -- see plan notes for full snippets. ---
  - id: gse-html
    type: html_css
    registry_url: https://www.gse.upenn.edu/events
    host: Penn GSE
    tags: [education]
    config:
      list_url: https://www.gse.upenn.edu/events
      item: "li.node--type-event"
      fields:
        event_name: {css: "a.event_list_item_title_link", attr: text}
        event_url: {css: "a.event_list_item_title_link", attr: href}
        # Drupal renders this as a Unix epoch string, e.g. datetime="1788998400"
        # -- normalize.datetimes.parse_datetime special-cases that shape.
        starts_at: {css: "time.event_list_item_time", attr: datetime}
        description: {css: ".event_list_item_description", attr: text}

  - id: dental-html
    type: html_css
    registry_url: https://www.dental.upenn.edu/events/
    host: Penn Dental
    tags: [dental]
    config:
      list_url: https://www.dental.upenn.edu/events/
      item: "div.row.pt-3.mb-3"
      fields:
        event_name: {css: "h2.page-title", attr: text}
        event_url: {css: "a", attr: href}
        starts_at: {css: "small", attr: text}
        location: {css: "span.fs-6.fw-light", attr: text}

  - id: design-html
    type: html_css
    registry_url: https://www.design.upenn.edu/events
    host: Stuart Weitzman School of Design
    tags: [design]
    config:
      list_url: https://www.design.upenn.edu/events
      item: "a.event-row"
      fields:
        event_name: {css: "span.title", attr: text}
        event_url: {css: "", attr: href}  # the item element itself is the <a>
        starts_at: {css: ".event-date", attr: text}

  - id: sp2-html
    type: html_css
    registry_url: https://www.sp2.upenn.edu/events/
    host: SP2
    tags: [social-policy]
    config:
      list_url: https://www.sp2.upenn.edu/events/
      item: "div.events-archive__item"
      fields:
        event_name: {css: "h3.event-item__title a", attr: text}
        event_url: {css: "h3.event-item__title a", attr: href}
        starts_at: {css: "time", attr: datetime}
        location: {css: ".event-item__location", attr: text}

  # --- The Events Calendar REST API: the best-behaved format in the       ---
  # --- registry. Confirmed live below.                                    ---
  - id: engineering-tec
    type: tec_rest
    registry_url: https://events.engineering.upenn.edu/
    host: Penn Engineering
    tags: [engineering]
    config:
      base_url: https://events.engineering.upenn.edu
      per_page: 50

  - id: vet-tec
    type: tec_rest
    registry_url: https://www.vet.upenn.edu/about/penn-vet-events-calendar
    host: Penn Vet
    tags: [veterinary]
    config:
      base_url: https://www.vet.upenn.edu
      per_page: 50

  - id: faculty-senate-tec
    type: tec_rest
    registry_url: https://facultysenate.upenn.edu/events/
    host: Faculty Senate
    tags: [faculty, governance]
    config:
      base_url: https://facultysenate.upenn.edu
      per_page: 50

  # --- Long-tail batch 1: found by bulk-probing the 421 still-unwired registry ---
  # --- rows (2026-09-07) for known feed patterns rather than hand-checking     ---
  # --- each one -- these three are genuinely separate WordPress + TEC          ---
  # --- installs (not sub-pages of a site already wired above), confirmed with  ---
  # --- real event data live.                                                   ---
  - id: quiest-tec
    type: tec_rest
    registry_url: https://quiest.seas.upenn.edu/
    host: QUIEST
    tags: [engineering]
    config:
      base_url: https://quiest.seas.upenn.edu
      per_page: 50

  - id: cetli-tec
    type: tec_rest
    registry_url: https://cetli.upenn.edu/
    host: Center for Teaching and Learning
    tags: [faculty]
    config:
      base_url: https://cetli.upenn.edu
      per_page: 50

  - id: penn-memory-center-tec
    type: tec_rest
    registry_url: https://pennmemorycenter.org/
    host: Penn Memory Center
    tags: [medicine]
    config:
      base_url: https://pennmemorycenter.org
      per_page: 50

  # --- Same batch, jsonld: pages that embed schema.org Event blocks directly   ---
  # --- (not via TEC's REST API) -- zero-config extraction, same as the         ---
  # --- generators/athletics-teams block above.                                 ---
  - id: grasp-jsonld
    type: jsonld
    registry_url: https://www.grasp.upenn.edu/events/category/seminars/
    host: GRASP Lab
    tags: [engineering, research-lab]
    config:
      url: https://www.grasp.upenn.edu/events/category/seminars/

  - id: epigenetics-jsonld
    type: jsonld
    registry_url: https://hosting.med.upenn.edu/epigenetics/calendar/list/
    host: Epigenetics Institute
    tags: [medicine, research-center]
    config:
      url: https://hosting.med.upenn.edu/epigenetics/calendar/list/

  - id: asset-jsonld
    type: jsonld
    registry_url: https://asset.seas.upenn.edu/events/
    host: ASSET Center
    tags: [engineering, research-center]
    config:
      # *.seas.upenn.edu is the old hostname for *.engineering.upenn.edu (per
      # calendar_source_types.md's documented alias) -- redirects there live;
      # httpx follows it, so this is the registry's own URL, not a workaround.
      url: https://asset.seas.upenn.edu/events/

  # --- Almanac: bot-blocked at the nginx layer for any UA containing a         ---
  # --- `(+http...)`-style contact URL (the conventional "polite crawler"       ---
  # --- format) regardless of the rest of the string -- confirmed live,        ---
  # --- 2026-09-07, by testing several UA variants; contradicted by the site's  ---
  # --- own robots.txt (`User-agent: *`, `Crawl-delay: 10`, no bot disallow),   ---
  # --- so this is a keyword/pattern false positive, not a deliberate block --  ---
  # --- unlike Annenberg/Penn Today below, where the block holds even for an   ---
  # --- exact Chrome UA. `user_agent` drops the URL but keeps a real,          ---
  # --- contactable identity (see feeders/almanac.py). The page itself is not  ---
  # --- a flat teaser list -- events are grouped into Bootstrap accordion      ---
  # --- panels by category (Talks, Music, ...), each a <p> with a bold day-of- ---
  # --- month that only appears on the first event of a day, so it needed a    ---
  # --- bespoke feeder/adapter pair instead of `html_css`'s field selectors.   ---
  - id: almanac-calendar
    type: almanac_calendar
    registry_url: https://almanac.upenn.edu/at-penn-calendar
    host: University
    tags: [university-wide]
    config:
      url: https://almanac.upenn.edu/at-penn-calendar
      user_agent: "PennEventsMonitor/1.0 (contact: pranshav.lakhia@gmail.com)"

  # --- Playwright: Penn Today and Annenberg both sit behind Cloudflare's        ---
  # --- "managed" JS challenge (`cType: 'managed'` in the response body,         ---
  # --- confirmed live 2026-09-07) -- a plain HTTP client 403s even sending an   ---
  # --- exact Chrome UA, so unlike Almanac above this genuinely needs a real     ---
  # --- browser, not a UA change. A stock headless Chromium (no stealth/         ---
  # --- fingerprint-spoofing plugins, no navigator.webdriver patching -- see     ---
  # --- feeders/playwright_html.py) executing the real challenge JS and waiting  ---
  # --- for it to resolve passes cleanly, presenting our honest PennEventsBot    ---
  # --- identity throughout. Reuses html_css's item/fields selector engine       ---
  # --- (adapters/html_adapter.py's `starts_time` field: some cards split date   ---
  # --- and time-of-day into separate elements) -- only the fetch differs.      ---
  - id: penn-today-html
    type: playwright_html
    registry_url: https://penntoday.upenn.edu/events
    host: University
    tags: [university-wide]
    config:
      list_url: https://penntoday.upenn.edu/events
      wait_selector: "article.event-card"
      item: "article.event-card"
      fields:
        event_name: {css: ".c-text .title .shy", attr: text}
        event_url: {css: "a.overlink", attr: href}
        starts_at: {css: ".c-date", attr: text}
        starts_time: {css: ".meta-list-item.event-time", attr: text}
        location: {css: ".meta-list-item.location", attr: text}
        description: {css: ".abstract", attr: text}

  - id: annenberg-html
    type: playwright_html
    registry_url: https://www.asc.upenn.edu/news-events/events
    host: Annenberg School for Communication
    tags: [communication]
    config:
      list_url: https://www.asc.upenn.edu/news-events/events
      wait_selector: "div.card--event"
      item: "div.card--event"
      fields:
        event_name: {css: "h2.h4 a", attr: text}
        event_url: {css: "h2.h4 a", attr: href}
        starts_at: {css: "time.show-for-sr", attr: datetime}
        starts_time: {css: "span.time", attr: text}
        location: {css: "ul.locations li", attr: text}
        description: {css: "p.medium-text", attr: text}

  # --- Long-tail batch 2 (2026-09-07): the bulk probe's 100 http_error rows     ---
  # --- split cleanly by which infra fronts them (checked live, not assumed):    ---
  # --- 65 were `server: cloudflare` -- same `cType: managed` shape already      ---
  # --- solved by playwright_html above, confirmed here again on a sample --      ---
  # --- these are real, solvable gaps. The rest are not, for two different       ---
  # --- reasons: 6 `awselb/2.0`-fronted *.upenn.edu department sites (history,   ---
  # --- chem, ling, physics, polisci, africa, bio) 403 for *every* client        ---
  # --- tested -- plain curl, a generic UA, and Playwright all get 403 with no   ---
  # --- challenge page at all, so this is an infra-level (likely IP/ASN) block,  ---
  # --- not a JS challenge -- no client-side strategy gets past it, and it is    ---
  # --- not something to route around. 11 more are www.law.upenn.edu institute   ---
  # --- sub-pages, CloudFront-fronted like the rest of that domain (see          ---
  # --- law-livewhale above) -- almost certainly the same redundant-sub-page     ---
  # --- case as the LiveWhale group filters, not investigated individually.
  - id: library-html
    type: playwright_html
    registry_url: https://www.library.upenn.edu/events
    host: Penn Libraries
    tags: [libraries]
    config:
      list_url: https://www.library.upenn.edu/events
      wait_selector: "article.listing-card.event"
      item: "article.listing-card.event"
      fields:
        event_name: {css: ".listing-card__title__link", attr: text}
        event_url: {css: ".listing-card__title__link", attr: href}
        starts_at: {css: "ul.listing-card__cal-info li:first-child", attr: text}
        location: {css: "ul.listing-card__cal-info li:nth-child(2)", attr: text}
        description: {css: ".listing-card__summary", attr: text}
      # The other 27 unwired library.upenn.edu registry rows (per-branch pages
      # like /dental, /vet, /museum) are branch homepages, not separate event
      # listings -- confirmed live (0 matching cards) -- so they're not
      # separately wireable, not merely redundant. /events/upcoming is a second
      # registry row for this exact page (confirmed identical event set).

  # --- SAS departments/centers share a handful of Drupal Views themes, not one --
  # --- -- checked 13 *.sas.upenn.edu sites individually rather than assuming a  ---
  # --- single shared template. These 3 use the same "events-listing" theme     ---
  # --- (`.events-listing.views-row` items, a real ISO datetime hiding on the   ---
  # --- *third* <time> tag in the date block -- the first two have no          ---
  # --- `datetime` attribute at all, hence `time[datetime]` below, not just     ---
  # --- `time`). A 4th, italian.sas.upenn.edu, shares this theme too but turned ---
  # --- out to be a duplicate of figs.sas.upenn.edu's exact event list (same    ---
  # --- titles, same dates) -- skipped as redundant, not wired separately. CASI ---
  # --- (below) shares none of this and needed its own selectors. A third       ---
  # --- theme -- `data-component-id="sas_theme:card_event"`, plain http(s), no  ---
  # --- Cloudflare challenge -- covers psychology/gsws/southasiacenter (wired   ---
  # --- below). southasia.upenn.edu is byte-for-byte identical text to          ---
  # --- southasiacenter.upenn.edu (same events, same titles) -- skipped as a    ---
  # --- duplicate domain, not wired separately. spanish.sas.upenn.edu/events    ---
  # --- 404s (stale registry URL). ceas, cseri and prss use neither theme and   ---
  # --- currently render zero events server-side -- not pursued further.
  - id: hss-html
    type: playwright_html
    registry_url: https://hss.sas.upenn.edu/events
    host: History and Sociology of Science
    tags: [arts-and-sciences]
    config:
      list_url: https://hss.sas.upenn.edu/events
      wait_selector: ".events-listing.views-row"
      item: ".events-listing.views-row"
      fields:
        event_name: {css: "h3.events-title a", attr: text}
        event_url: {css: "h3.events-title a", attr: href}
        starts_at: {css: ".event-date time[datetime]", attr: datetime}
        description: {css: ".description", attr: text}

  - id: figs-html
    type: playwright_html
    registry_url: https://figs.sas.upenn.edu/events
    host: French, Italian & Germanic Studies
    tags: [arts-and-sciences]
    config:
      list_url: https://figs.sas.upenn.edu/events
      wait_selector: ".events-listing.views-row"
      item: ".events-listing.views-row"
      fields:
        event_name: {css: "h3.events-title a", attr: text}
        event_url: {css: "h3.events-title a", attr: href}
        starts_at: {css: ".event-date time[datetime]", attr: datetime}
        description: {css: ".description", attr: text}

  - id: theatre-html
    type: playwright_html
    registry_url: https://theatre.sas.upenn.edu/events
    host: Theatre Arts
    tags: [arts-and-sciences, arts]
    config:
      list_url: https://theatre.sas.upenn.edu/events
      wait_selector: ".events-listing.views-row"
      item: ".events-listing.views-row"
      fields:
        event_name: {css: "h3.events-title a", attr: text}
        event_url: {css: "h3.events-title a", attr: href}
        starts_at: {css: ".event-date time[datetime]", attr: datetime}
        description: {css: ".description", attr: text}

  # --- CASI: a different Drupal Views theme from the three above (plain        ---
  # --- `views-field-*` classes, two separate <time datetime> siblings for      ---
  # --- start/end rather than a nested date-block).                            ---
  - id: casi-html
    type: playwright_html
    registry_url: https://casi.sas.upenn.edu/events
    host: Center for the Advanced Study of India
    tags: [arts-and-sciences, research-center]
    config:
      list_url: https://casi.sas.upenn.edu/events
      wait_selector: ".views-field-title"
      item: "div:has(> .views-field-title):has(> .views-field-field-event-date)"
      fields:
        event_name: {css: ".views-field-title a", attr: text}
        event_url: {css: ".views-field-title a", attr: href}
        starts_at: {css: ".views-field-field-event-date time[datetime]", attr: datetime}
        description: {css: ".views-field-field-event-speaker-info", attr: text}

  # --- psychology/southasiacenter/gsws share the "sas_theme:card_event"        ---
  # --- component. A plain GET worked in isolated testing but 403'd when run    ---
  # --- alongside the rest of the sweep (confirmed live, 2026-09-07) -- an      ---
  # --- intermittent Cloudflare/WAF block under load, same family as the other  ---
  # --- *.sas.upenn.edu sites above, so all three use the real headless        ---
  # --- browser rather than relying on plain HTTP staying lucky.               ---
  - id: psychology-html
    type: playwright_html
    registry_url: https://psychology.sas.upenn.edu/events
    host: Psychology
    tags: [arts-and-sciences]
    config:
      list_url: https://psychology.sas.upenn.edu/events
      wait_selector: 'div[data-component-id="sas_theme:card_event"]'
      item: 'div[data-component-id="sas_theme:card_event"]'
      fields:
        event_name: {css: ".card_content h2, .card_content h3", attr: text}
        event_url: {css: ".card_content a", attr: href}
        starts_at: {css: "time[datetime]", attr: datetime}
        location: {css: ".field--name-field-location", attr: text}
        description: {css: ".field--name-body", attr: text}

  - id: southasiacenter-html
    type: playwright_html
    registry_url: https://www.southasiacenter.upenn.edu/events
    host: South Asia Center
    tags: [arts-and-sciences, research-center]
    config:
      list_url: https://www.southasiacenter.upenn.edu/events
      wait_selector: 'div[data-component-id="sas_theme:card_event"]'
      item: 'div[data-component-id="sas_theme:card_event"]'
      fields:
        event_name: {css: ".card_content h2, .card_content h3", attr: text}
        event_url: {css: ".card_content a", attr: href}
        starts_at: {css: "time[datetime]", attr: datetime}
        location: {css: ".field--name-field-location", attr: text}
        description: {css: ".field--name-body", attr: text}

  - id: gsws-html
    type: playwright_html
    registry_url: https://gsws.sas.upenn.edu/events
    host: Gender, Sexuality, and Women's Studies
    tags: [arts-and-sciences]
    config:
      list_url: https://gsws.sas.upenn.edu/events
      wait_selector: 'div[data-component-id="sas_theme:card_event"]'
      item: 'div[data-component-id="sas_theme:card_event"]'
      fields:
        event_name: {css: ".card_content h2, .card_content h3", attr: text}
        event_url: {css: ".card_content a", attr: href}
        starts_at: {css: "time[datetime]", attr: datetime}
        location: {css: ".field--name-field-location", attr: text}
        description: {css: ".field--name-body", attr: text}

  # --- Water Center: same "events-listing.views-row" theme as hss/figs/theatre ---
  # --- above (odd for a WordPress-labeled registry row, but the live markup    ---
  # --- matches exactly) -- only 1 upcoming event as of 2026-09-07, but the     ---
  # --- selectors are free to reuse.                                           ---
  - id: watercenter-html
    type: playwright_html
    registry_url: https://watercenter.sas.upenn.edu/events/
    host: The Water Center at Penn
    tags: [arts-and-sciences, research-center]
    config:
      list_url: https://watercenter.sas.upenn.edu/events/
      wait_selector: ".events-listing.views-row"
      item: ".events-listing.views-row"
      fields:
        event_name: {css: "h3.events-title a", attr: text}
        event_url: {css: "h3.events-title a", attr: href}
        starts_at: {css: ".event-date time[datetime]", attr: datetime}
        description: {css: ".description", attr: text}

  # --- CEET: plain WordPress, Cloudflare-fronted like everything else in this  ---
  # --- batch. No year in the date block (month/day only, like Penn Today --    ---
  # --- dateutil defaults to the current year) and the time-range + location    ---
  # --- share one <p> separated by an en dash, not a hyphen -- the reason        ---
  # --- html_adapter's range-splitting regex was widened to accept both.        ---
  - id: ceet-html
    type: playwright_html
    registry_url: https://ceet.upenn.edu/events/
    host: Center of Excellence in Environmental Toxicology
    tags: [medicine, research-center]
    config:
      list_url: https://ceet.upenn.edu/events/
      wait_selector: "article.event-card"
      item: "article.event-card"
      fields:
        event_name: {css: ".event-card__title a", attr: text}
        event_url: {css: ".event-card__title a", attr: href}
        starts_at: {css: ".event-card__date", attr: text}
        starts_time: {css: ".event-card__content p", attr: text}

  # --- Penn Global: isss and pennabroad share the exact same WordPress theme   ---
  # --- (`card--dynamic` / `event-date` block) -- confirmed by identical class   ---
  # --- structure on both, unlike the SAS Drupal sites above which mostly       ---
  # --- didn't share a theme with each other. Both pages' listings are          ---
  # --- currently stale (dated 2025 into early 2026, nothing recent) -- that's  ---
  # --- the real content on the page as of 2026-09-07, not a scraping bug; it   ---
  # --- will pick up real events automatically once each site's own listing is  ---
  # --- updated, same as any other feeder.
  - id: isss-html
    type: playwright_html
    registry_url: https://global.upenn.edu/isss/events
    host: International Student and Scholar Services
    tags: [global]
    config:
      list_url: https://global.upenn.edu/isss/events
      wait_selector: ".card--dynamic"
      item: ".card--dynamic"
      fields:
        event_name: {css: ".card__heading a", attr: text}
        event_url: {css: ".card__heading a", attr: href}
        starts_at: {css: "time.date--start", attr: text}
        description: {css: ".card__excerpt", attr: text}

  - id: penn-abroad-html
    type: playwright_html
    registry_url: https://global.upenn.edu/pennabroad/events/
    host: Penn Abroad
    tags: [global]
    config:
      list_url: https://global.upenn.edu/pennabroad/events/
      wait_selector: ".card--dynamic"
      item: ".card--dynamic"
      fields:
        event_name: {css: ".card__heading a", attr: text}
        event_url: {css: ".card__heading a", attr: href}
        starts_at: {css: "time.date--start", attr: text}
        description: {css: ".card__excerpt", attr: text}

  - id: pci-html
    type: playwright_html
    registry_url: https://pci.upenn.edu/events/
    host: Penn Center for Innovation
    tags: [university-wide]
    config:
      list_url: https://pci.upenn.edu/events/
      wait_selector: ".ep-event-list-item"
      item: ".ep-event-list-item"
      fields:
        event_name: {css: ".ep-box-list-title a", attr: text}
        event_url: {css: ".ep-box-list-title a", attr: href}
        starts_at: {css: ".ep-event-date", attr: text}
        starts_time: {css: ".ep-event-date + span", attr: text}

  - id: snf-paideia-html
    type: playwright_html
    registry_url: https://snfpaideia.upenn.edu/engage/events/
    host: SNF Paideia Program
    tags: [university-wide]
    config:
      list_url: https://snfpaideia.upenn.edu/engage/events/
      wait_selector: ".c-entry-card"
      item: ".c-entry-card"
      fields:
        event_name: {css: ".c-entry-card__titleLink", attr: text}
        event_url: {css: ".c-entry-card__titleLink", attr: href}
        starts_at: {css: ".c-entry-card__eventDate", attr: text}
        description: {css: ".c-entry-card__body", attr: text}

  # --- Penn Alumni: iModules/Anthology Encompass, plain HTTP (no Cloudflare).  ---
  # --- Per-event .ics download links exist but there's no site-wide feed --   ---
  # --- scraping the list page instead. The date block has no year (just       ---
  # --- "Sep" / "10"), and the time range is spelled out as "6:30 PM to        ---
  # --- 11:30 PM" -- no dash at all -- which is why `_first_range_token`'s      ---
  # --- separator regex was widened to also split on the word "to". The page   ---
  # --- renders the SAME events again under several category tabs             ---
  # --- (#imodcmscalendar2351{1..9}) -- confirmed live, 2026-09-07: 115 raw    ---
  # --- .eventItem nodes, only 53 distinct events, and #imodcmscalendar23511   ---
  # --- (the "All Events" tab, largest of the set) alone already contains all  ---
  # --- 53 with zero repeats -- so item is scoped to that one tab's subtree,   ---
  # --- not the whole page, to avoid re-ingesting duplicates as separate rows. ---
  - id: penn-alumni-html
    type: html_css
    registry_url: https://www.alumni.upenn.edu/events
    host: Penn Alumni Relations
    tags: [alumni, university-wide]
    config:
      list_url: https://www.alumni.upenn.edu/events
      item: "#imodcmscalendar23511 .eventItem"
      fields:
        event_name: {css: ".title a", attr: text}
        event_url: {css: ".title a", attr: href}
        starts_at: {css: ".date", attr: text}
        starts_time: {css: ".details .time", attr: text}
        location: {css: ".details .location", attr: text}

# Deliberately not wired yet (each needs more than a plain HTTP GET to resolve):
#
#   - Wharton's own www.wharton.upenn.edu/events/ registry row -- confirmed via
#     view-source that the page is a Salesforce "EventsHQ" widget
#     (wharton.my.salesforce-sites.com/wevents/lightning/lightning.out.js)
#     rendered entirely client-side; there is no server-rendered listing or feed
#     to scrape. Needs the Playwright feeder. (Real Wharton event data is wired
#     via the `wharton-campusgroups` feeder above instead -- a different
#     registry row for the same school, with a real feed.)
#
generators:
  # --- Athletics: SIDEARM's schedule pages (pennathletics.com/sports/<slug>/    ---
  # --- schedule) turned out to need no new feeder type at all -- each page      ---
  # --- embeds a bare JSON-LD array of `@type: "SportsEvent"` blocks (confirmed  ---
  # --- live, 2026-09-07, across football/wrestling/volleyball/crew/cross        ---
  # --- country -- same shape every time). SportsEvent is a schema.org subtype   ---
  # --- of Event, so `jsonld_adapter._iter_event_nodes` was widened to accept    ---
  # --- any `*Event` type, not a new adapter. Slugs below match                  ---
  # --- `calendars.calendar_url` exactly (all 32 confirmed present in the        ---
  # --- registry as "Athletics (team schedule)" rows) and pennathletics.com's    ---
  # --- own nav, not guessed.
  - id: athletics-teams
    type: jsonld
    host: Athletics
    tags: [athletics]
    for_each:
      - baseball
      - mens-basketball
      - mens-crew
      - mens-cross-country
      - mens-fencing
      - mens-golf
      - mens-lacrosse
      - mens-rowing
      - mens-soccer
      - mens-squash
      - mens-swimming-and-diving
      - mens-tennis
      - mens-track-and-field
      - field-hockey
      - football
      - softball
      - sprint-football
      - womens-basketball
      - womens-cross-country
      - womens-fencing
      - womens-golf
      - womens-gymnastics
      - womens-lacrosse
      - womens-rowing
      - womens-soccer
      - womens-squash
      - womens-swimming-and-diving
      - womens-tennis
      - womens-track-and-field
      - womens-volleyball
      - wrestling
    template:
      id: "athletics-{item}"
      registry_url: "https://pennathletics.com/sports/{item}/schedule"
      tags: ["{item}"]
      config:
        url: "https://pennathletics.com/sports/{item}/schedule"
