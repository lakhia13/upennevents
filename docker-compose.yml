# Local development environment.
#
# Production does not run this stack: Postgres and the REST API are a hosted
# Supabase project, and the scrape is a scheduled GitHub Actions job (see
# .github/workflows/). This file stays so you can work offline and test against a
# throwaway database without touching live data -- the credentials below are
# deliberately local-only placeholders.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: penn
      POSTGRES_PASSWORD: penn
      POSTGRES_DB: pennevents
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Host port 5433, not 5432: this machine already runs a local Postgres on
      # 5432. Change back to "5432:5432" if that's not true in your environment.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penn -d pennevents"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://penn:penn@db:5432/pennevents
      POSTGREST_AUTHENTICATOR_PASSWORD: ${POSTGREST_AUTHENTICATOR_PASSWORD:-postgrest_dev_password}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["python", "-m", "penn_events.pipeline.scheduler"]
    environment:
      DATABASE_URL: postgresql+psycopg://penn:penn@db:5432/pennevents
      LOG_LEVEL: INFO
    volumes:
      # Bind-mount so master.yaml / tag_rules.yaml changes don't need a rebuild.
      - ./penn_events/config:/app/penn_events/config
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGREST_AUTHENTICATOR_PASSWORD:-postgrest_dev_password}@db:5432/pennevents
      PGRST_DB_SCHEMA: api
      PGRST_DB_ANON_ROLE: web_anon
      # Forces pagination -- without a cap a client could request the whole
      # events table in a single call. This is a hard ceiling PostgREST applies
      # even when a client's own `limit` asks for more, so it silently truncates
      # results once crossed -- it has already had to be raised twice this
      # project as feeder coverage grew (200 -> 2000 -> 5000, 2026-09-07;
      # 2035 active events with 47 feeders wired). Raise it again if ingestion
      # coverage grows past this, and prefer erring high -- a stale low cap here
      # is what causes results to silently vanish from the frontend, not a loud
      # error.
      PGRST_DB_MAX_ROWS: "5000"
      PGRST_OPENAPI_MODE: follow-privileges
    ports:
      - "3001:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg_data:
