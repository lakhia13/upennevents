# Scheduled ingestion run -- the production replacement for the APScheduler worker.
#
# The scrape is a batch job, not a service: ~5 minutes of work, four times a day.
# Hosting a 24/7 container for that is what free tiers punish (they spin down on
# idle, and a sleeping container never fires its cron), so it runs here instead.
name: scrape

on:
  schedule:
    # Every 6 hours, matching defaults.schedule in penn_events/config/master.yaml.
    # Every feeder currently uses that default, so this reproduces the previous
    # cadence exactly. GitHub queues scheduled runs on a best-effort basis and can
    # delay them under load -- fine for a 6-hourly refresh, not a hard guarantee.
    - cron: "0 */6 * * *"
  workflow_dispatch:

# A slow run must never overlap the next one: two concurrent sweeps would upsert
# the same rows simultaneously. Queue instead of cancelling, so a run that is
# genuinely still working is allowed to finish.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # matches docker/Dockerfile
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # No Playwright/Chromium install here: every playwright_html feeder in
      # master.yaml is currently tagged datacenter-ip-blocked (2026-09-07) and
      # excluded below, so nothing in this run needs a browser. Confirmed live
      # via a workflow-run screenshot: Cloudflare serves GitHub's well-known
      # datacenter IP ranges an interactive Turnstile checkbox instead of the
      # silent challenge that works from local dev, and no wait time or
      # concurrency change gets a stock browser past that -- see the
      # `datacenter-ip-blocked` comment in master.yaml for the full account.
      # If a future playwright_html feeder is added WITHOUT that tag, restore
      # the Chromium install steps (see git history on this file) before it can
      # run here.
      - name: Run all feeders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LOG_LEVEL: INFO
        # Tolerate a couple of failures: these are ~52 third-party university
        # sites (the 16 datacenter-ip-blocked ones are excluded, not just
        # tolerated -- they'd fail every single run, which would mask a real
        # new failure among the rest), and one being down for a few hours is
        # normal. Everything that succeeded still landed either way.
        run: |
          python -m penn_events.cli run-all --concurrency 8 --max-failures 3 \
            --exclude-tag datacenter-ip-blocked
